build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  UnusedPrivateMember:
    # @Preview composables are only invoked by Compose tooling, never from app code.
    ignoreAnnotated: [ Preview, PreviewLightDark ]

comments:
  active: false

naming:
  FunctionNaming:
    # Jetpack Compose factory functions use PascalCase by convention.
    ignoreAnnotated: [Composable]
